# 内容包：endings（结局集）
#
# 定位：所有结局场景。分流逻辑集中在 end-select 一个场景里，
# 用条件表达式按玩家状态路由到不同结局。
#
# 结局设计参考《生命线》系列的核心特征：
#   - 多数选择通向死亡结局（生命线原作中玩家通常在几次尝试内失败）
#   - 少数选择通向「真结局」，且需要**持续累积**的正确行为（高信任 + 关键线索）
#   - 有「翻转结局」：看似成功但有代价
#
# 分流优先级（自上而下第一个满足者生效）：
#   1. 极低信任（trust < 20）        → end-refused   她切断了连接
#   2. 她死在你身边（信任高但没救活） → end-mercy
#   3. 知道龙吼 + 极高信任 + 关键线索  → end-thu-um     隐藏真结局
#   4. 举报告发了她                     → end-soldiers
#   5. 保温失败                         → end-frozen
#   6. 龙裔身份暴露                     → end-dragon
#   7. 高信任 + 未被出卖                → end-whiterun   真结局
#   8. 她独自走完                       → end-alone
#   9. 兜底                             → end-refused

pack:
  id: endings
  name: 霜语 · 结局集
  version: 0.1.0
  entry: end-select
  description: 八个结局：真结局、死亡结局、隐藏结局、翻转结局
  author: siwpan
  requires:
    plugins: [combat]
    state: [hp, stamina, warmth, rations, gold, trust, soul, clock, items, flags, clues]

scenes:
  end-select:
    title: 结局 · 分流
    text: |
      （城门在身后关上了。声音很沉，像盖棺材盖。）

      （水晶里的光又暗了一点。）
    choices:
      # ── 1. 她切断了连接（信任极低）─────────────────────────
      - text: 「……」
        if: 'trust < 20'
        goto: end-refused
      # ── 2. 她死了但你还在（高信任 + 她受伤过深）────────────
      - text: 「……」
        if: 'trust >= 55 and hp <= 4'
        goto: end-mercy
      # ── 3. 隐藏真结局：龙吼 ────────────────────────────────
      - text: 「……」
        if: 'trust >= 75 and clues.thuUm and flags.knewTruth'
        goto: end-thu-um
      # ── 4. 被举报告发 ────────────────────────────────────
      - text: 「……」
        if: 'flags.bribedGuard and not flags.keptSecret'
        goto: end-soldiers
      # ── 5. 冻死 ───────────────────────────────────────────
      - text: 「……」
        if: 'warmth <= 12'
        goto: end-frozen
      # ── 6. 她见过龙，且拒绝过你 ────────────────────────────
      - text: 「……」
        if: 'flags.sawDragon and flags.refusedAdvice'
        goto: end-dragon
      # ── 7. 真结局：走进白漫 ────────────────────────────────
      - text: 「……」
        if: 'trust >= 65'
        goto: end-whiterun
      # ── 8. 独自走完 ────────────────────────────────────────
      - text: 「……」
        if: 'trust >= 40'
        goto: end-alone
      # ── 9. 兜底 ────────────────────────────────────────────
      - text: 「……」
        goto: end-refused

  # ══════════════════════════════════════════════════════════════
  # 真结局
  # ══════════════════════════════════════════════════════════════
  end-whiterun:
    title: 结局 · 白漫
    text: |
      她找到了他。

      是在城里最靠北的一间屋子里——那些守墓人的家。
      他在烧东西，烧的是纸。看见她的时候，
      他手里的东西掉了。

      「海尔薇。」

      「你活着。」

      她在门口站了很久，才说出一句话：

      「我带了一个人来。」

      她指了指水晶。

      他看着那枚石头，愣了很久。

      「……灵魂链接。」

      「帝国末年的东西。还在用？」

      「不是他用的。」她说，「是他。」

      然后她笑了。这是整个故事里她第一次真的笑。

      「他一直在我脑袋里指挥我。」

      「烦死了。」

      —

      那天晚上，阿尔卡给了她三个选择：
      割掉那团火（会死），
      封住它（会变成别的东西），
      或者去找龙核（会死，但可能不用死）。

      她选了第三个。

      但那天晚上，在走之前，她做了一件多余的事——
      她把水晶举到唇边，说了一句：

      「谢了。」

      然后她走了。

      水晶里安静下来。过了很久，
      传来他的声音，很小，像是从很远的地方：

      「……你也是。」

      —

      后来你还听见过她一次。

      是在一个驿站里，商人说起龙临堡的事，
      说那天有个女人从里面走出来，浑身是血，
      抱着一个箱子往北走。没人知道她叫什么。

      「她跟人说话的时候一直在跟谁说话，
      我路过好几回她都没停。」

      「我问她跟谁说话，她说——」

      「'没有谁。'」

      —

      后来有一次，她的声音又从很远的地方传过来。
      是在跟阿尔卡说话，说的是风隘，说她看见了那栋小屋、
      说里面有人、说她没去。

      「他没骂我。他就说了句'好'。」

      停顿。

      「……他是那种人。」

      更远的脚步声。她在走。

      然后是最后一句，几乎听不见：

      「喂。」

      「那边还有人吗。」

      「我在。」

    onEnter: { clock: +1 }
    # is_ending 允许「全 @ 目标选项」→ 保留结局身份，同时给玩家重开出口。
    choices:
      - text: 「（重新开始。）」
        goto: '@restart'

  end-thu-um:
    title: 结局 · 龙吼（隐藏）
    text: |
      她站在城墙上。

      「你说得对。」

      「它想要的是蛋。我身上有蛋。」

      「那我就把蛋还给它。」

      阿尔卡在旁边喊了什么，她没听。

      她闭上眼。

      然后——

      那不是吼。

      那是**语言**。

      你听见了。你一直听得见她的声音，
      但你从来没听过这个——

      一个词，从龙的喉咙里，由人的嘴说出。

      整座城都震了。

      墙外，天上，有什么巨大的东西转了方向。

      —

      阿尔卡后来跟你说了那天的结局。

      他说：她站在那儿，一直喊。
      喊到嗓子撕了，喊到血从嘴角出来。

      那条老龙来了。它来了，不攻击，
      只是低下头——像是在听。

      它听了很久。

      然后它走了。

      往北。往龙临堡。回到它的蛋那儿去。

      「它把她当成了同类。」阿尔卡说。

      「诺德人当年就是这么换来龙吼的——
      不是杀，是谈判。」

      「代价是，有人得一直站在那儿，
      一直喊，直到对方听明白。」

      「她喊了六个小时。」

      「——她活下来了。火没有再烧。」

      「她留下了。」

      「在城墙上。面朝北。」

      「一直到今天。」

    onEnter: { 'flags.keptSecret': false }

  # ══════════════════════════════════════════════════════════════
  # 翻转结局：她死了，但事办成了
  # ══════════════════════════════════════════════════════════════
    # is_ending 允许「全 @ 目标选项」→ 保留结局身份，同时给玩家重开出口。
    choices:
      - text: 「（重新开始。）」
        goto: '@restart'

  end-mercy:
    title: 结局 · 留下的人
    text: |
      她倒在你听见她的地方。

      不——不是倒下。是坐下来。靠着墙，
      像一个赶了一天路终于到家的人。

      「我到了。」

      「我看见火了。真正的火。」

      然后是呼吸。越来越慢。

      「……你还在吗。」

      「我有点听不清了。水晶的光也变得很暗。」

      「不过没关系。」

      「我知道你在。」

      「……那个人在城里的哪条街，你记得吗。
      我忘了。我一直想着这件事，想忘了。」

      「'阿尔卡'。他在……在哪……」

      —

      第二天你去了白漫。

      你找到了她说的那个人。守墓人的家，
      最靠北的一间，门口堆着烧过的纸。

      你把她的事说了。

      他听完，很久没说话。

      「她进城的路上，跟我说过话。」

      「她说：'替我照顾那个拿石头的人。'」

      「我以为她在开玩笑。」

      第二天他走了。往北。往龙临堡。
      带了一个箱子。

      第三天，城北的水晶摊上多了一枚石头。
      不是龙语水晶。是普通的、被烟熏黑的石头。

      摊主说：有人留下的。说是给「那个一直跟她说话的人」。

      你买下来了。

      它当然不会说话。

      但你每次把它握在手里，石头是温的。


  # ══════════════════════════════════════════════════════════════
  # 死亡结局
  # ══════════════════════════════════════════════════════════════
    # is_ending 允许「全 @ 目标选项」→ 保留结局身份，同时给玩家重开出口。
    choices:
      - text: 「（重新开始。）」
        goto: '@restart'

  end-refused:
    title: 结局 · 断线
    text: |
      她的声音变了。不是变冷，是变得很正式。

      「我要切断链接了。」

      「不是生你的气。」

      「是你让我没办法做决定。」

      「每一个决定都是你替我做的。
      每一个我不同意的地方，你都说'来得及'。
      每一次我想问'你觉得呢'，你都在说话。」

      「我不需要一个人替我活着。」

      「我需要——」

      停了很久。

      「算了。」

      「水晶给你。留着当个念想。」

      「……你会找到别的办法的。你一向有办法。」

      咔。

      —

      光灭了。

      不是慢慢暗的。是灭了。

      你把那块石头握在手里，一直握到天亮。
      它再也不热了。
    # is_ending 允许「全 @ 目标选项」→ 保留结局身份，同时给玩家重开出口。
    choices:
      - text: 「（重新开始。）」
        goto: '@restart'

  end-soldiers:
    title: 结局 · 报告
    text: |
      你听见了链条的声音。

      然后是她的声音，很平静，平静得不正常。

      「他们来了。」

      「……是你说的那句话，对不对。
      '跟他们走，你随时能走'。」

      「我能走。但我没走。」

      「不是因为我信你。是因为我以为——
      我以为你至少在听。」

      脚步声。很多。

      「他们要带我去哪，海尔根？还是别的地方？」

      「……算了。」

      「你说得对。我确实不该信一个声音。」

      水晶里传来很响的一声——是金属撞石头。

      然后是很长的沉默。
    # is_ending 允许「全 @ 目标选项」→ 保留结局身份，同时给玩家重开出口。
    choices:
      - text: 「（重新开始。）」
        goto: '@restart'

  end-frozen:
    title: 结局 · 冷
    text: |
      她的声音开始发飘。

      「好冷。」

      「……比刚才冷。」

      「我动不了了。手不听话。」

      「你别担心。这不是你的错。
      你已经做了你能做的了。」

      「——你做了吗？」

      她笑了一下。很小声。

      「抱歉。我不该这么问。」

      「你说过的。你说'来得及'。」

      「……你说的时候，我就该知道的。」

      呼吸声越来越浅。

      「喂。」

      「……你在吗。」

      「我有点想不起来了。你的声音，
      刚才是像什么来着。」

      「想不起来了。」
    # is_ending 允许「全 @ 目标选项」→ 保留结局身份，同时给玩家重开出口。
    choices:
      - text: 「（重新开始。）」
        goto: '@restart'

  end-dragon:
    title: 结局 · 龙
    text: |
      「它在上面。」

      「它一直都在。它只是在等——等我自己走进来。」

      「……原来那晚在海尔根，它也是这么等我的。」

      「我以为我是去侦察龙的。」

      「我是去送自己的。」

      「你听出来了，对不对。你从一开始就听出来了。」

      「你为什么不说。」

      巨大的阴影盖过整条街。

      「算了。」

      「……那就这样吧。」

      「别怪自己。你没做错任何事。」

      「你只是——」

      「——太远了。」
    # is_ending 允许「全 @ 目标选项」→ 保留结局身份，同时给玩家重开出口。
    choices:
      - text: 「（重新开始。）」
        goto: '@restart'

  end-alone:
    title: 结局 · 一个人
    text: |
      她没有再说话。

      你不知道她是死了，还是只是不想说了。

      你在城外的雪里站了很久。
      直到有个人——一个赶路的商人——
      停下来问你是不是需要帮忙。

      你说不用。

      你没有说她在这附近。

      —

      后来你在一个驿站听人说起龙临堡的事。

      说那天有个女人从里面走出来，
      浑身是血，抱着一个箱子，往北走。

      没人知道她叫什么。

      商人说：「她跟人说话的时候，
      一直在跟谁说话。
      我路过好几回，她都没停。」

      「我问她跟谁说话，她说——」

      「'没有谁。'」


  # ══════════════════════════════════════════════════════════════
  # 公共收尾
  #
  # 注意：结局场景本身**必须无选项** —— 引擎 is_ending 的判定是
  # 「normal 模式且无选项（或全是 @ 目标）」。若结局场景自带选项，
  # 它不会被算作结局，coverage 结局覆盖门就统计不到它。
  # 因此「重新开始」统一放在这里，由各结局的 onExit/后继衔接。
  # ══════════════════════════════════════════════════════════════
    # is_ending 允许「全 @ 目标选项」→ 保留结局身份，同时给玩家重开出口。
    choices:
      - text: 「（重新开始。）」
        goto: '@restart'

