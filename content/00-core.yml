# 内容包：core（序章 · 灵魂链接）
#
# 叙事框架（对应《生命线》的结构）：
#   玩家 = 持有灵魂水晶的「远端」，只能通过水晶与她说话；
#   主角 = 海尔薇·霜门，身在风隘以南的雪原，正在死去。
#   场景正文 = 她的「消息」；选项 = 你给她的建议。
#
# ★ 结构铁律（见 docs/design.md「藤蔓结构」一节）：
#   本作的场景图必须保持**藤蔓形**——大多数选项汇入同一下一场景，
#   少数通向终局或短支线。线形主干（每场景分叉再合流）会让
#   traverse 的路径数呈指数爆炸，CI 门禁跑不完。
#   引擎两门禁（check 静态 / traverse 动态）就是靠这个假设成立的。
#
# 本文件演示 DSE 的五种表达手段：
#   1. extraText   —— 条件文本段（按状态追加旁白）
#   2. variants    —— 文本变体（同一场景的多种措辞）
#   3. once        —— 一次性选项（选过即消失）
#   4. 加权 goto   —— 概率分支（★ 生命线灵魂：她有时会拒绝你的建议）
#   5. dialogue    —— 有限注意力的谈判（notes 预算）

pack:
  id: core
  name: 霜语 · 序章
  version: 0.1.0
  entry: core-open
  description: 序章：灵魂链接建立；演示 extraText / variants / once / 加权分支 / dialogue
  author: siwpan
  modes: [dialogue, diary]
  requires:
    plugins: [dialogue, diary]
    state: [hp, stamina, warmth, rations, trust, soul, clock, flags, clues, items]

scenes:
  # ══════════════════════════════════════════════════════════════
  # 入口
  # ══════════════════════════════════════════════════════════════
  core-open:
    title: 序章 · 雪下的声音
    text: |
      雪从铅灰色的天幕上落下来，已经下了三天。

      你在风隘以北的废弃驿站里找到这枚水晶时，它被冻在一块裂开的岩石里，
      表面刻着一种你不认识的文字——后来你才知道那叫龙语。

      今晚它开始发热。

      不是被炉火烤热的那种热。是从内部烧起来的热，
      烫得你几乎松手，而你确实松手了——它掉在雪里，却没熄灭，
      反而在雪面上烧出一个完美的圆，圆心透出微弱的橘色光。

      然后你听见了声音。

      不是从耳朵听见的。是直接落进脑子里的，一个女人的声音，
      疲惫、沙哑，像是很久没跟人说过话：

      「……有人吗。」

      她停了很久。

      「有人能听见我吗。」

    choices:
      - text: 「有人。我在听。」——你俯身靠近那圈光
        goto: core-voice
      - text: 「这里信号很差，你那边是什么地方？」
        goto: core-voice
      - text: 「……」（你什么也没说，只是把手按在水晶上）
        goto: core-voice

  # ══════════════════════════════════════════════════════════════
  # 第一次接触
  # ══════════════════════════════════════════════════════════════
  core-voice:
    title: 序章 · 第一次接触
    text: |
      你的手掌贴上水晶的一瞬，火焰矮了一寸，像是被谁按住了。

      「……谢谢。」她说，「我还以为这是最后一次了。」

      「我叫海尔薇。姓不重要了，霜门是我自己取的。」

      「你在哪？」她问，「不是问位置。是问——你还在那边吗，
      还是说你在赶过来的路上。」

      她笑了一声，那声音在雪地里听起来格外薄。

      「别骗我。我分辨得出。」

    extraText:
      - if: 'trust >= 40'
        text: |
          （她的语气松了一点。也许是因为你还没骗她。）
    choices:
      - text: 「我在这里。哪儿也不去。」
        do: { trust: +4, 'clues.soulLink': true }
        goto: core-switch
      - text: 「我离得很远。远到帮不上忙，但听得见。」
        do: { trust: +2, 'clues.soulLink': true }
        goto: core-switch
      - text: 「我不知道。这是第一次有人跟我说话。」
        do: { trust: +1, 'clues.soulLink': true }
        goto: core-switch

  # ══════════════════════════════════════════════════════════════
  # 视角切换：此后正文 = 她的消息，选项 = 你的建议
  # ══════════════════════════════════════════════════════════════
  core-switch:
    title: 序章 · 约定
    text: |
      「好。听着，我时间不多。」

      「从现在起，我说的每一句话你都会听见。我做的事你看不见——
      所以你要说得准。」

      「我会尽量照你说的做。」

      她顿了顿。

      「……尽量。」

    extraText:
      - if: 'trust < 30'
        text: |
          （她不信你。你听得出来。）
    choices:
      - text: 「那我们先说眼下：你在雪地里多久了？」
        do: { soul: -1, trust: +2 }
        goto: core-advice-1
      - text: 「尽量？什么叫尽量？」
        do: { trust: +1 }
        goto: core-advice-1
      - text: 「往东走，绕过风隘峡谷，那边有猎人的木屋。」
        do: { soul: -1, warmth: +2 }
        goto: core-advice-1

  # ── 第一次「建议 vs 她的判断」：加权 goto 演示 ──────────────────
  # 权重大 = 她更可能采纳你的建议。seed 固定时结果可复现（CI 友好）。
  # ★ 注意：两个分支都汇入同一个后继（core-ask），这是藤蔓结构的关键——
  #   加权分支只改变「过程」不复制「下游」，路径数才不会爆炸。
  core-advice-1:
    title: 序章 · 第一个建议
    text: |
      「两天，也许三天。我从海尔根爬出来之后就一直在走，
      腿不听使唤，右手也不听使唤。」

      「我不知道我在往哪走。我只知道后面有东西在飞。」

      「你说往东——东边是什么？」

    extraText:
      - if: 'trust >= 45'
        text: |
          （她还在听。你感觉得出来——这几句她会认真想。）
      - if: 'trust < 45'
        text: |
          （水晶那头有点距离感。她没完全信你——话得说得准。）

    # ★ 0.3.0：信任真正驱动「她听不听」。引擎的 weight 只接受数字字面量
    #   （engine._pick_weighted 不解析表达式），所以用「if 门控的重复选项组」
    #   模拟动态权重：同一句话两套写法、条件互斥、玩家只看得到其中一套。
    #   高信任时她九成照做；低信任时违抗概率显著上升。两条支路仍汇入 core-ask。
    choices:
      # ── 建议一：缓坡 / 火（最具体的建议）──
      - text: 「东边是缓坡，有猎人小屋，有火。」
        if: 'trust >= 45'
        do: { soul: -1, trust: +2 }
        goto:
          - { to: core-east-obey, weight: 9 }
          - { to: core-east-defy, weight: 1 }
      - text: 「东边是缓坡，有猎人小屋，有火。」
        if: 'trust < 45'
        do: { soul: -1, trust: +2 }
        goto:
          - { to: core-east-obey, weight: 5 }
          - { to: core-east-defy, weight: 5 }
      # ── 建议二：先有路 ──
      - text: 「东边有路。先有路，再想别的。」
        if: 'trust >= 45'
        do: { soul: -1, trust: +1 }
        goto:
          - { to: core-east-obey, weight: 8 }
          - { to: core-east-defy, weight: 2 }
      - text: 「东边有路。先有路，再想别的。」
        if: 'trust < 45'
        do: { soul: -1, trust: +1 }
        goto:
          - { to: core-east-obey, weight: 4 }
          - { to: core-east-defy, weight: 6 }
      # ── 建议三：先治伤（她最可能拒绝的一条）──
      - text: 「别管东边了。你手上还有伤吗？」
        if: 'trust >= 45'
        do: { soul: -1 }
        goto:
          - { to: core-east-obey, weight: 6 }
          - { to: core-east-defy, weight: 4 }
      - text: 「别管东边了。你手上还有伤吗？」
        if: 'trust < 45'
        do: { soul: -1 }
        goto:
          - { to: core-east-obey, weight: 3 }
          - { to: core-east-defy, weight: 7 }

  core-east-obey:
    title: 序章 · 她照做了
    text: |
      「……好。」

      「你说缓坡。」

      她开始说风的声音，然后是一声很轻的、
      像是把什么东西从雪里拔出来的声响。

      「有树枝。」她说，「冻住了，但有树枝。」

      「你那边能听见我吗？我在走了。」

    onEnter: { trust: +2, warmth: +3 }
    choices:
      - text: 「听得见。一直听着。」
        do: { trust: +2 }
        goto: core-ask
      - text: 「手别停下来。边走边说。」
        do: { trust: +1 }
        goto: core-ask

  core-east-defy:
    title: 序章 · 她没有照做
    text: |
      「等一下。」

      她的声音忽然紧了。

      「你说东边有木屋。可我刚才看见了烟——不是木屋的烟，
      是营火的烟，一堆，有人在守。」

      「海尔根那天晚上，就是这么烧起来的。」

      「你说东边是缓坡。好。可我不过去。」

    onEnter: { 'flags.refusedAdvice': true, 'flags.sawDragon': true, warmth: -4, trust: -2 }
    extraText:
      - if: 'trust < 35'
        text: |
          （她不信你。至少现在不信。）
    choices:
      - text: 「……好。你比我更清楚那边是什么。」
        do: { trust: +3 }
        goto: core-ask
      - text: 「那你说，往哪走。」
        do: { trust: +2 }
        goto: core-ask
      - text: 「你这样会死。信我一次。」
        do: { soul: -1 }
        goto: core-ask

  # ══════════════════════════════════════════════════════════════
  # 有限注意力的谈判：她回答你的问题，但问不满就结束
  # ══════════════════════════════════════════════════════════════
  core-ask:
    title: 序章 · 你能问的问题不多
    text: |
      她的呼吸声稳了一些。这大概是你能问的最合适的时机——
      再晚一点，她连说话都会嫌浪费。
    mode: dialogue
    dialogue:
      npc: 海尔薇
      notes: 2
      onEnd: core-depart
      topics:
        - id: who
          name: 你是怎么到海尔根的？
          reply: |
            「我不是龙的。」

            「我是斥候。风暴斗篷的斥候——去年冬天他们派了六个人去
            侦察龙巢的路线。我走在最后。」

            「那东西从北边过来的时候，前面五个连喊都没来得及喊。」
          effect:
            trust: +2
            'clues.nordCustom': true
        - id: truth
          name: 海尔根那天到底发生了什么？
          reply: |
            「……我不能说。」

            她沉默了很久。

            「不是不信你。是这件事我一旦说出口，你就再也回不了头了。」

            「你确定要问吗。」
          effect:
            'clues.helgenTruth': true
            trust: +3
        - id: link
          name: 这枚水晶是什么？
          reply: |
            「心灵链接。」

            「帝国末年那批法师做的，能把一缕意识缝进石头里。
            代价是——两头都得付。」

            「你每多说一句，它就少一点。我听你说话的时候，
            也一样。」

            「所以别浪费在我听不见的地方。」
          effect:
            'clues.soulLink': true
            trust: +2
        - id: why
          name: 你为什么还活着？
          if: 'trust >= 55'
          reply: |
            「……你问得真准。」

            「我也不知道。」

            「那天晚上，有个人替我挡了一下。我没看清是谁。」

            「我活下来不是因为我有本事。」

            她停了一会儿。

            「我一直觉得这是欠下来的。」
          effect:
            trust: +4
            'flags.knewTruth': true
        # ── 0.3.0：灵魂水晶余量门控的深度咨询 ──
        # 每问一次都在花水晶；水晶见底就问不出这个「多余的问题」。
        # 这是 soul 的软后果：不是硬死亡，而是「说不下去了」——
        # 省着用能多知道一件事，花光了就只剩信号里的杂音。
        - id: listener
          name: （多花一点水晶）那边……一直是你吗？
          if: 'soul >= 2'
          reply: |
            她沉默的时间比平时长。

            「你问这个做什么。」

            「……我不知道。就是有时候觉得，
            你那边太安静了。安静得不像有人。」

            「我说话的时候，你从来不喘气。不咳嗽。不碰东西。」

            「有一次我停了很久，想听听你那边有没有什么声音。」

            「什么都没有。」

            「你到底是在听，还是——」

            她没说完。

            「算了。你听得见就行。」
          effect:
            soul: -2
            trust: +2
            'clues.playerIdentity': true

  # ══════════════════════════════════════════════════════════════
  # 教学：记忆回廊（diary 模式 = 重读已读过的消息）
  # ══════════════════════════════════════════════════════════════
  core-rules:
    title: 序章 · 备忘
    text: |
      她的呼吸声远了一点。风把话吹散了。

      「我得走了。天亮前得走到有墙的地方。」

      「……如果你还在，就记住一件事。」

      「你说过的话，我不一定听。但我记着。」

      「想不起刚才说过什么的时候——」

    choices:
      - text: 「——就翻我们的对话记录？」
        goto: core-corridor
      - text: 「——你说，我都记着。」
        do: { trust: +2 }
        goto: core-depart

  core-corridor:
    title: 记忆回廊
    text: |
      石头里存着你们说过的所有话。翻一翻，也许能想起什么。
    # ★ 0.3.0 不可靠叙述：同一段记忆，细节随「她是否已经说出真相」而变。
    #   玩家跨周目比对才会发现——她讲的版本一直在微调。
    extraText:
      - if: 'clues.helgenTruth and flags.knewTruth'
        text: |
          （你翻到海尔根那一夜。她说那条龙是「从北边来的」。
          可你记得法师说过，它刚被放逐——是从天上掉下来的。
          两种说法都像真的。你不确定哪一句是她想让你记住的。）
      - if: 'flags.looped'
        text: |
          （有一段记忆是重复的。你明明是第一次翻它，却认得那句话的结尾。
          石头记得的不只是话——还有你「上一次」读过它。）
    mode: diary
    diary:
      onExit: core-depart

  # ══════════════════════════════════════════════════════════════
  # 出发
  # ══════════════════════════════════════════════════════════════
  core-depart:
    title: 序章 · 出发
    text: |
      「我走了。」

      「从现在起，我每隔一段时间会找你一次。
      不是我想打扰你——是这石头里的东西不够多了，
      每一次开口都是花掉的。」

      「所以，」

      她顿了顿，像是在挑一句最要紧的。

      「挑要紧的说。」

      「……对了。你要是忘了我们说过什么——
      翻一下你手里那块石头。它记着。」

    onEnter: { clock: +1 }
    choices:
      - text: 「先说最要紧的：活着到白漫。」
        do: { trust: +2, soul: -1 }
        goto: ch1-open
      - text: 「先说最要紧的：你背后那东西，到底是什么。」
        do: { trust: +1, soul: -1 }
        goto: ch1-open
      - text: 「先说最要紧的：别死。」
        do: { trust: +3 }
        goto: ch1-open
      - text: 「（先翻翻记录。看看我们之前说过什么。）」
        once: 'core-review-once'
        goto: core-rules
