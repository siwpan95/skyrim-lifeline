# 内容包：ch1-frostgate（第一章 · 风隘）
#
# 定位：生存压力建立段。核心机制演示：
#   - 战斗（battle 模式）：霜狼遭遇战
#   - once 一次性选项：「喝掉最后一口」类不可逆决策
#   - 加权 goto：多处「她听不听你的」
#   - trade 模式：灰烬渡口的补给（跨章复用）
#
# 压力设计：warmth（体温）是本作唯一的硬死亡线。
#   体温随场景推移自然下降；篝火/食物/干粮是唯一的回升手段。
#   玩家必须在「信任她」和「保住她的命」之间反复取舍。

pack:
  id: ch1-frostgate
  name: 霜语 · 第一章 风隘
  version: 0.1.0
  entry: ch1-open
  description: 雪原求生：体温压力、霜狼遭遇、灰烬渡口的补给
  author: siwpan
  modes: [battle, trade]
  requires:
    plugins: [combat, trade]
    state: [hp, stamina, warmth, rations, trust, soul, clock, items, flags, clues]

scenes:
  # ══════════════════════════════════════════════════════════════
  # 第一章入口
  # ══════════════════════════════════════════════════════════════
  ch1-open:
    title: 第一章 · 风隘
    text: |
      「……冷。」

      她的声音听起来像是从很远的地方传来，又像是就贴在你耳朵边上。

      「我一直在走。走了多久我不知道——太阳没出来过，
      这里的天永远是那种要下雪又不下雪的灰。」

      「前面有个隘口。我记得有路。」

      「你那边有声音吗？我这边只有风。」

    onEnter: { warmth: -6, clock: +1 }
    choices:
      - text: 「有。我一直听着。慢慢走，别摔。」
        do: { trust: +2, warmth: +2 }
        goto: ch1-ravine
      - text: 「有路就行。其他的等活下来再说。」
        do: { warmth: +1 }
        goto: ch1-ravine
      - text: 「你再撑一下，前面有猎人小屋。」
        do: { soul: -1, trust: +1 }
        goto:
          - { to: ch1-ravine, weight: 8 }
          - { to: ch1-refuse-hut, weight: 2 }

  # ── 她拒绝你的建议（once + 加权）──────────────────────────────
  ch1-refuse-hut:
    title: 第一章 · 她没去小屋
    text: |
      「小屋。」她重复了一遍。

      「你是说那栋？坡下面那个？」

      她笑了一声，那声音里有种你不喜欢的东西。

      「我路过过。两次。」

      「里面有东西。不止是灰。」

      「我不去。」

    onEnter: { warmth: -3, 'flags.refusedAdvice': true }
    choices:
      - text: 「……好。」
        do: { trust: +1 }
        goto: ch1-ravine
      - text: 「你在怕什么？」
        do: { trust: +2, soul: -1 }
        goto: ch1-ravine

  # ══════════════════════════════════════════════════════════════
  # 峡谷：第一次「你劝她绕路，她不肯」
  # ══════════════════════════════════════════════════════════════
  ch1-ravine:
    title: 第一章 · 裂谷
    text: |
      「找到了。路在这。」

      一阵窸窣声——她的脚步踩在冻硬的雪壳上。

      「但这不是路。这是一条沟。两边都是石头，
      中间一条黑带子，我看不见底。」

      「风从底下往上吹。」

      「……我跳下去过两次。第一次太早，第二次太晚。」

      「第三次不一样了。这次我打算沿着走。」

    onEnter: { warmth: -5, stamina: -2 }
    choices:
      - text: 「别跳。沿着走是对的，但往左贴石壁，那边风小。」
        do: { soul: -1, warmth: +3 }
        goto:
          - { to: ch1-ravine-wall, weight: 7 }
          - { to: ch1-ravine-center, weight: 3 }
      - text: 「跳。这条沟我查过，底是碎石堆，摔不死。」
        do: { soul: -1 }
        goto:
          - { to: ch1-ravine-jump, weight: 5 }
          - { to: ch1-ravine-wall, weight: 5 }
      - text: 「往回走，找别的路。」
        do: { soul: -1, stamina: +2 }
        goto:
          - { to: ch1-ravine-wall, weight: 4 }
          - { to: ch1-ravine-back, weight: 6 }

  ch1-ravine-wall:
    title: 第一章 · 贴壁
    text: |
      「……贴着石头。」

      风声忽然小了一点。

      「你说得对。这边确实小。」

      她的脚步慢下来，呼吸变重。

      「我还能听见你。」

    onEnter: { warmth: +4, stamina: -2 }
    choices:
      - text: 「我一直都在。慢点没关系。」
        do: { trust: +3 }
        goto: ch1-wolf
      - text: 「省点力气。别说话了。」
        goto: ch1-wolf

  ch1-ravine-center:
    title: 第一章 · 沟底
    text: |
      风把她的声音撕成碎片。

      「——听得见吗——我在这边——」

      「好冷。」

      「但是——但是过去了。过来了。」

      「你还在吗。」

    onEnter: { warmth: -12, stamina: -4 }
    choices:
      - text: 「我在。我在。走，继续走。」
        do: { trust: +1 }
        goto: ch1-wolf
      - text: 「快起来，别停。」
        goto: ch1-wolf

  ch1-ravine-jump:
    title: 第一章 · 跳
    text: |
      「跳。」

      她重复了一遍你的话，像是在确认。

      「好。」

      沉默。

      然后是一声闷响——不算太重。碎石的声音，持续了几秒。

      「……摔不死。」

      她的声音在笑。

      「你还真查过。」

    onEnter: { stamina: -6, warmth: -6 }
    choices:
      - text: 「我说过我会查。」
        do: { trust: +4 }
        goto: ch1-wolf
      - text: 「别得意，赶紧起来。」
        do: { trust: +1 }
        goto: ch1-wolf

  ch1-ravine-back:
    title: 第一章 · 回头
    text: |
      「回头。」

      她没有动。

      「我回头走过两次了。两次都是绕回原地，
      绕回这个沟口，绕回那栋小屋。」

      「我不回头。」

      她的语气不是赌气。是陈述。

      「你说往哪走。我听着。」

    onEnter: { stamina: +3, warmth: -4, 'flags.refusedAdvice': true }
    choices:
      - text: 「……沿沟走。贴左壁。」
        do: { trust: +1 }
        goto: ch1-ravine-wall
      - text: 「那你告诉我你怕什么。」
        do: { soul: -1, trust: +2 }
        goto: ch1-ravine-wall

  # ══════════════════════════════════════════════════════════════
  # 霜狼遭遇战
  # ══════════════════════════════════════════════════════════════
  ch1-wolf:
    title: 第一章 · 灰里的眼睛
    text: |
      「停。」

      她的声音突然压得很低。

      「前面……石头缝里。有东西在看我。」

      「不止一只。天太灰，我看不清。但那个眼神——
      绿的。像冰。」

      「我知道那是什么。海尔根那天晚上，
      尸体里爬出来的就是这种。」

      「……我手里有块铁片。不算武器。」

      「怎么办。」

    onEnter: { 'flags.metWolf': true, warmth: -2 }
    extraText:
      - if: 'items.frostBlade >= 1'
        text: |
          （你的剑就在手边。你想起她说过：狼颈下三寸。）
    choices:
      - text: 「往前冲，别让它先动。」
        do: { soul: -1 }
        goto: ch1-wolf-fight
      - text: 「退，往沟里退，贴着石头。」
        do: { soul: -1 }
        goto:
          - { to: ch1-wolf-fight, weight: 4 }
          - { to: ch1-wolf-retreat, weight: 6 }
      - text: 「扔石头引开它，然后绕过去。」
        do: { soul: -1, stamina: -2 }
        goto:
          - { to: ch1-wolf-fight, weight: 5 }
          - { to: ch1-wolf-retreat, weight: 5 }

  ch1-wolf-fight:
    title: 第一章 · 遭遇
    text: |
      「——来了。」

      你听见了。风里混进了别的声音：爪子刮石头，
      喉咙里的低吼，还有她短促地吸了一口气。

      「两只。不，三只。」

      「铁片在手里。往哪砍。」

    mode: battle
    battle: { enemy: frostWolf, onWin: ch1-wolf-win, onLose: ch1-wolf-lose, onFlee: ch1-wolf-retreat }

  ch1-wolf-win:
    title: 第一章 · 血在雪上
    text: |
      最后一声很短。

      然后是她的呼吸，很重，拖着一点湿气。

      「……死了？」

      「死了。」她自己回答了自己。

      「天哪。手在抖。」

      长久的沉默。

      「谢谢。」

      「我不知道该往哪儿谢。」

    onEnter: { 'items.wolfPelt': +1, gold: +6, stamina: -3, warmth: -4 }
    choices:
      - text: 「谢你自己。能打的人是你。」
        do: { trust: +4 }
        goto: ch1-after-wolf
      - text: 「别谢。往前，天快亮了。」
        goto: ch1-after-wolf

  ch1-wolf-lose:
    title: 第一章 · 雪上的血
    text: |
      石头刮在铁片上，很响。

      然后是很长一段什么都没有。

      「……你还在吗。」

      她的声音已经不像在问你了。

      「算了。」

      「别说话。留着。」

      「留着做别人用。」

    onEnter: { hp: -6, warmth: -10 }
    choices:
      - text: 「你听着。海尔薇。」
        do: { soul: -1, trust: +2 }
        goto: ch1-after-wolf
      - text: 「（你什么也没说。说什么都没用了。）」
        goto: ch1-after-wolf

  ch1-wolf-retreat:
    title: 第一章 · 退
    text: |
      「退了。」

      她的呼吸很急。

      「没追上。」

      「……掉了一样东西。我不知道是什么。铁片？」

      「不重要。」

      「重要的是我还在这儿。」

    onEnter: { stamina: -5, warmth: -6 }
    choices:
      - text: 「还在就好。继续走。」
        goto: ch1-after-wolf
      - text: 「慢点。先站稳。」
        do: { trust: +1 }
        goto: ch1-after-wolf

  # ══════════════════════════════════════════════════════════════
  # 分岔：篝火 vs 继续赶路
  # ══════════════════════════════════════════════════════════════
  ch1-after-wolf:
    title: 第一章 · 灰白的天
    text: |
      天开始亮了一点。灰里透出一点白，算不上日出。

      「前面有岔路。」

      「左边往上，绕过隘口顶端，能看见白色的东西——
      我不知道是雪还是石头。右边往下，有水声。」

      「我停不下来了。腿在抖。但是我停不下来。」

    onEnter: { warmth: -3, clock: +1 }
    choices:
      - text: 「右边。水边有树，树下能挡风。」
        do: { soul: -1 }
        goto: ch1-ford
      - text: 「左边。上去看清楚那是什么。」
        do: { soul: -1, stamina: -2 }
        goto: ch1-summit
      - text: 「找个背风的地方停下来。生火。」
        do: { soul: -1 }
        goto: ch1-camp

  # ── 火堆：唯一能回升体温的地方 ───────────────────────────────
  ch1-camp:
    title: 第一章 · 背风处
    text: |
      「有块大石头。风从北边来，我贴着南面。」

      「我需要火。」

      「没有火柴。有石头，有干草——一点——还有……」
      她顿了一下。

      「还有我自己的火。」

      「龙焰烧在我右边肋上。到现在还没灭。」

      「我可以把它引出来。生一堆火。」

      「但是那东西……我不想让它离我太近。」

    onEnter: { warmth: +8, stamina: -3 }
    choices:
      - text: 「生火。你需要它比我需要它更近。」
        do: { soul: -1, trust: +3, warmth: +14, rations: -1 }
        goto: ch1-camp-after
      - text: 「别生。你离它远点。忍一忍。」
        do: { trust: +1, warmth: +8 }
        goto: ch1-camp-after
      - text: 「你确定？它会不会伤到你？」
        do: { soul: -1, trust: +2 }
        goto:
          - { to: ch1-camp-after, weight: 8 }
          - { to: ch1-camp-burn, weight: 2 }

  ch1-camp-burn:
    title: 第一章 · 引出来
    text: |
      「引出来了。」

      她的声音变了——变高了，变薄了，像是有两个人在说话。

      「好热——不，不对——」

      火光照亮了水晶的那一侧。你看见她的影子在雪上翻滚，
      看见一团不是橘色的、蓝白色的东西从她肋下涌出来，
      烧穿了积雪，烧穿了石头——

      「别看！别——」

      然后是很长很长的安静。

      「……还在。」

      「我还在。火也还在。」

      「只是……有点疼。」

    onEnter: { warmth: +26, stamina: -8, hp: -4, 'flags.sawDragon': true }
    choices:
      - text: 「你说疼就停。火够了。」
        do: { trust: +4 }
        goto: ch1-camp-after
      - text: 「把火围起来。围住它。」
        do: { trust: +2, warmth: +6 }
        goto: ch1-camp-after

  ch1-camp-after:
    title: 第一章 · 火边
    text: |
      火确实起来了。她的脸在火光里显出轮廓——
      比你想象的年轻，也比你想象的狼狈。

      「暖了一点。」

      「你听我说，海尔薇这边有些东西我想告诉你。」

      她顿了顿。

      「但我现在说不出来。脑子是糊的。」

      「让我睡一会儿。太阳出来再说。」

    variants:
      - 她把披风裹紧，闭上眼睛。火把她的睫毛照成一小排金线。
      - 火光在她脸上跳。她数着自己的呼吸，数到二十几下就乱了。
      - 她盯着火看，像是在看火里某个不存在的人。
    variantMode: cycle
    onEnter: { warmth: +6, stamina: +4, clock: +1 }
    choices:
      - text: 「睡吧。我守着。」
        do: { trust: +4, soul: -1 }
        goto: ch1-ford
      - text: 「别睡。太阳一出就走。」
        do: { trust: +1 }
        goto: ch1-ford

  # ── 两条路：谷底渡口 / 山顶 ──────────────────────────────────
  ch1-ford:
    title: 第一章 · 谷底渡口
    text: |
      「有水。」

      「一条河。不宽，但是流得很快，声音很响。」

      「这里有……人气。有烟。有马。」

      她突然安静了。

      「不对。那不是人。」

      「那烟是绿的。」

    onEnter: { warmth: -4 }
    choices:
      - text: 「别过去。绕。」
        do: { soul: -1 }
        goto: ch1-green-smoke
      - text: 「走过去。不管那是什么。」
        do: { soul: -1 }
        goto: ch1-cross-ashford

  ch1-summit:
    title: 第一章 · 隘口顶端
    text: |
      「上来了。」

      「风更大，但是能看见——」

      她的声音卡住了。

      「能看见白漫。」

      「雪下面有城。有塔。有烟囱冒烟。」

      「我看见了。」

      「那下面有火。到处都是火。」

    onEnter: { warmth: -8, stamina: -3 }
    choices:
      - text: 「看到了就还有希望。往那边走。」
        do: { trust: +3, stamina: +2 }
        goto: ch1-see-whiterun
      - text: 「先别下去。找别的路。」
        do: { soul: -1 }
        goto: ch1-green-smoke

  ch1-see-whiterun:
    title: 第一章 · 白漫
    text: |
      「我在看那座城。」

      「很久没看见过活着的东西了。」

      「有炊烟。有狗叫。有人在敲东西，叮叮当当的。」

      「……我想到那儿去。」

      「然后我又想到——我身上的东西。」

      「那东西一进有人的地方，就全完了。」

      「你说怎么办。」

    onEnter: { warmth: -5 }
    choices:
      - text: 「先到灰烬渡口。那边有个走私贩，也许有办法。」
        do: { soul: -1, trust: +2 }
        goto: ch1-cross-ashford
      - text: 「直接去白漫。找大夫，找法师，找任何人。」
        do: { soul: -1 }
        goto: ch1-see-whiterun
      - text: 「你说怎么办？这种事你得自己决定。」
        do: { trust: +1 }
        goto: ch1-green-smoke

  ch1-green-smoke:
    title: 第一章 · 绿烟
    text: |
      「绕过来了。」

      「绕了好久。天都黑了一半。」

      「我刚才从那堆绿烟边上走过去了。很近。」

      「有东西在里面。不是一个。是很多。
      它们在动，但是不叫。」

      「有一个转向我了。」

      「……它没有追。」

      「为什么没有追？」

    onEnter: { warmth: -10, stamina: -4, 'flags.sawDragon': true }
    extraText:
      - if: 'flags.sawDragon'
        text: |
          （她身上那东西，和那片绿烟，是同一种。）
    choices:
      - text: 「因为你身上有它认得的东西。快走。」
        do: { soul: -1, 'clues.dragonLair': true }
        goto: ch1-cross-ashford
      - text: 「别管为什么。你还活着。这才是重点。」
        do: { trust: +2 }
        goto: ch1-cross-ashford
