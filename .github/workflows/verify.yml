name: verify

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  gates:
    # 项目 CLI 与 .cmd 垫片契约是 Windows 专属，回归必须在 Windows runner 上跑
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'

      - name: Install engine and SAST tool
        run: python -m pip install "dse-core>=0.7.0" semgrep

      - name: Record engine version
        run: python -m pip show dse-core

      - name: Static check
        run: dse check

      - name: SAST (semgrep)
        run: semgrep scan --config .semgrep.yml --error tools/

      - name: Four-layer gates
        run: python tools/verify.py

      - name: CLI regression
        run: python tests/cli_check.py
